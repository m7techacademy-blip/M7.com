<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M7 TECH ACADEMY</title>
     <link rel="icon" type = "favicon" href="M7 LOGO.png">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #0a0a1a;
        }

        /* ===== VIDEO BACKGROUND ===== */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.50);
            z-index: -1;
        }

        /* ===== ANIMATED STARS ===== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: floatStars linear infinite;
            opacity: 0.6;
        }

        @keyframes floatStars {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.8rem 1.5rem 1.2rem;
        }

        /* ===== HEADER WITH LOGO ===== */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            padding: 0.3rem 0;
            flex-wrap: wrap;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.3rem 1.8rem 0.3rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%,
            100% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 215, 0, 0.1);
            }
            50% {
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 215, 0, 0.25);
            }
        }

        .header .logo img {
            height: 55px;
            width: auto;
            border-radius: 12px;
            filter: drop-shadow(0 4px 15px rgba(255, 215, 0, 0.3));
            transition: transform 0.5s ease;
        }

        .header .logo img:hover {
            transform: scale(1.08) rotate(-3deg);
        }

        .header .logo h1 {
            font-size: clamp(1.6rem, 5vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .header .logo h1 i {
            -webkit-text-fill-color: #fff;
            margin-right: 6px;
            font-size: 0.8em;
        }

        /* ===== BODY BUTTONS ===== */
        .body-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            padding: 0.5rem 0;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            width: 100%;
            max-width: 440px;
        }

        /* ===== BUTTON STYLES WITH ANIMATIONS ===== */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 1.1rem 2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            animation: btnFadeUp 0.8s ease-out both;
        }

        .btn:nth-child(1) {
            animation-delay: 0.1s;
        }
        .btn:nth-child(2) {
            animation-delay: 0.25s;
        }
        .btn:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes btnFadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .btn i {
            font-size: 1.8rem;
            width: 32px;
            text-align: center;
            transition: all 0.4s ease;
        }

        .btn:hover {
            transform: scale(1.06) translateY(-3px);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:hover i {
            transform: scale(1.2) rotate(-8deg);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .btn:hover::after {
            opacity: 1;
            animation: pulseGlow 1s ease-out;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.5);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* ===== INDIVIDUAL BUTTON STYLES ===== */
        .btn-facebook {
            background: linear-gradient(135deg, #1877f2, #0d65d9);
            border-color: #1877f2;
            box-shadow: 0 8px 30px rgba(24, 119, 242, 0.3);
        }
        .btn-facebook:hover {
            background: linear-gradient(135deg, #1a86ff, #1877f2);
            border-color: #fff;
            box-shadow: 0 8px 40px rgba(24, 119, 242, 0.6);
            animation: shake 0.5s ease;
        }

        .btn-tiktok {
            background: linear-gradient(135deg, #000000, #1a1a1a);
            border-color: #25f4ee;
            box-shadow: 0 8px 30px rgba(37, 244, 238, 0.15);
        }
        .btn-tiktok:hover {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-color: #fe2c55;
            box-shadow: 0 8px 40px rgba(254, 44, 85, 0.4);
            animation: shake 0.5s ease;
        }
        .btn-tiktok i {
            color: #25f4ee;
        }
        .btn-tiktok:hover i {
            color: #fe2c55;
        }

        .btn-register {
            background: linear-gradient(135deg, #0a0812, #035973);
            border-color: #d29000;
            box-shadow: 0 8px 30px rgba(0, 184, 148, 0.3);
        }
        .btn-register:hover {
            background: linear-gradient(135deg, #020414, #ce9f05);
            border-color: #fff;
            box-shadow: 0 8px 40px rgba(0, 184, 148, 0.6);
            animation: shake 0.5s ease;
        }
        .btn-register i {
            color: #ffeaa7;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0) scale(1.06);
            }
            20% {
                transform: translateX(-6px) scale(1.06);
            }
            40% {
                transform: translateX(6px) scale(1.06);
            }
            60% {
                transform: translateX(-4px) scale(1.06);
            }
            80% {
                transform: translateX(4px) scale(1.06);
            }
        }

        .hint-text {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 0.2rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.5px;
            animation: btnFadeUp 0.8s ease-out 0.6s both;
        }

        .hint-text i {
            color: #ffd700;
            margin-right: 6px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 1rem 1.5rem;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: btnFadeUp 0.8s ease-out 0.7s both;
        }

        .footer .phone-numbers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem 1.8rem;
            font-size: clamp(0.85rem, 2.2vw, 1.05rem);
            font-weight: 500;
        }

        .footer .phone-numbers span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .footer .phone-numbers span:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 215, 0, 0.2);
            transform: scale(1.03);
        }

        .footer .phone-numbers i {
            color: #9d9306;
            font-size: 0.95rem;
        }

        .footer .footer-brand {
            margin-top: 0.6rem;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.6rem;
        }

        .footer .footer-brand i {
            color: #ffd700;
            margin: 0 4px;
        }

        /* ===== SOUND INDICATOR ===== */
        .sound-indicator {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 210, 160, 0.15);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 50px;
            border: 1px solid rgba(0, 210, 160, 0.3);
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.8);
            animation: pulseSound 2s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sound-indicator:hover {
            background: rgba(0, 210, 160, 0.25);
            border-color: #675e04;
            transform: scale(1.05);
        }

        .sound-indicator i {
            color: #dbb312;
            font-size: 1.2rem;
        }

        .sound-indicator .sound-status {
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .sound-indicator .sound-dots {
            display: inline-flex;
            gap: 3px;
        }

        .sound-indicator .sound-dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: #dada09;
            border-radius: 50%;
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        .sound-indicator .sound-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .sound-indicator .sound-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%,
            100% {
                transform: scale(0.5);
                opacity: 0.3;
            }
            50% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes pulseSound {
            0%,
            100% {
                opacity: 0.8;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.8rem 0.8rem;
            }
            .header .logo {
                padding: 0.2rem 1rem 0.2rem 0.8rem;
                gap: 8px;
            }
            .header .logo img {
                height: 40px;
            }
            .header .logo h1 {
                font-size: clamp(1.2rem, 5vw, 1.8rem);
            }
            .btn {
                font-size: 1rem;
                padding: 0.8rem 1.2rem;
                gap: 10px;
            }
            .btn i {
                font-size: 1.5rem;
                width: 26px;
            }
            .footer .phone-numbers {
                gap: 0.4rem 0.8rem;
            }
            .footer .phone-numbers span {
                padding: 0.2rem 0.7rem;
                font-size: 0.75rem;
            }
            .sound-indicator {
                bottom: 70px;
                right: 10px;
                padding: 6px 12px;
                font-size: 0.65rem;
                gap: 6px;
            }
            .sound-indicator i {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== VIDEO BACKGROUND ===== -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="https://cdn.pixabay.com/video/2023/07/17/173101-845620227_large.mp4" type="video/mp4" />
    </video>
    <div class="overlay"></div>

    <!-- ===== ANIMATED STARS ===== -->
    <div class="stars" id="starsContainer"></div>

    <!-- ===== SOUND INDICATOR (dhanka hoose midig) ===== -->
    <div class="sound-indicator" id="soundIndicator" title="Dib u dhageyso welcome-ka">
        <i class="fas fa-volume-up"></i>
        <span class="sound-status" id="soundStatus">Welcome</span>
        <span class="sound-dots">
            <span></span>
            <span></span>
            <span></span>
        </span>
    </div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <!-- ===== HEADER WITH LOGO ===== -->
        <div class="header">
            <div class="logo">
                <!-- ⚡ LOGO PNG: ku beddel src-ga hoose link-ka PNG-gaaga -->
                <img src="M7 LOGO.png" alt="M7 Logo" />
                <h1><i class="fas fa-graduation-cap"></i> M7 TECH ACADEMY</h1>
            </div>
        </div>

        <!-- ===== BODY BUTTONS ===== -->
        <div class="body-content">
            <div class="btn-group">

                <!-- BUTTON 1: FACEBOOK -->
                <a href="https://www.facebook.com/share/14kf6LsgerB/" target="_blank" class="btn btn-facebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </a>

                <!-- BUTTON 2: TIKTOK -->
                <a href="https://www.tiktok.com/@m7techacademy?_r=1&_t=ZS-98xR1VY4x9Q" target="_blank" class="btn btn-tiktok">
                    <i class="fab fa-tiktok"></i> TikTok
                </a>

                <!-- BUTTON 3: ISDIWAAN GALIN -->
                <a href="https://form.jotform.com/262281807338057" target="_blank" class="btn btn-register">
                    <i class="fas fa-user-plus"></i> Isdiiwaan Gali
                </a>

            </div>
            <div class="hint-text">
                <i class="fas fa-hand-pointer"></i> si toos ah ama whatspp-ka naga soo wac
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <div class="phone-numbers">
                <span><i class="fas fa-phone-alt"></i> 252 610448092</span>
                <span><i class="fas fa-phone-alt"></i> 252 613081533</span>
                <span><i class="fas fa-phone-alt"></i> 252 616299377</span>
            </div>
            <div class="footer-brand">
                <i class="fas fa-code"></i> M7 TECH ACADEMY &bull; 2026 <i class="fas fa-heart" style="color: #ff6b6b;"></i>
            </div>
        </div>

    </div>

    <script>
        // ===== AUTO-PLAY VIDEO =====
        document.getElementById('bg-video').play().catch(() => {});

        // ===== CREATE ANIMATED STARS =====
        (function createStars() {
            const container = document.getElementById('starsContainer');
            const count = 80;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 4 + 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 15 + 10) + 's';
                star.style.animationDelay = (Math.random() * 20) + 's';
                star.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(star);
            }
        })();

        // ===== AUTOMATIC WELCOME SOUND (no delay) =====
        (function playWelcomeSound() {
            // Check if browser supports speech synthesis
            if ('speechSynthesis' in window) {
                // Function to speak
                function speakWelcome() {
                    // Cancel any previous speech
                    window.speechSynthesis.cancel();

                    const msg = new SpeechSynthesisUtterance();
                    msg.text = "Welcome to M Seven Tech Academy";
                    msg.lang = "en-US";
                    msg.rate = 0.9;
                    msg.pitch = 1.0;
                    msg.volume = 1;

                    // Try to find a good voice
                    const voices = window.speechSynthesis.getVoices();
                    const preferred = voices.find(v => v.lang.startsWith('en'));
                    if (preferred) msg.voice = preferred;

                    // Speak
                    window.speechSynthesis.speak(msg);

                    // Update status
                    document.getElementById('soundStatus').textContent = '🔊 Playing';
                }

                // Check if voices are loaded
                const voices = window.speechSynthesis.getVoices();
                if (voices.length === 0) {
                    // Wait for voices to load
                    window.speechSynthesis.onvoiceschanged = function() {
                        speakWelcome();
                    };
                } else {
                    // Speak immediately
                    speakWelcome();
                }

                // ===== REPLAY when indicator clicked =====
                document.getElementById('soundIndicator').addEventListener('click', function() {
                    // Cancel any ongoing speech
                    window.speechSynthesis.cancel();

                    const replayMsg = new SpeechSynthesisUtterance();
                    replayMsg.text = "Welcome to M Seven Tech Academy";
                    replayMsg.lang = "en-US";
                    replayMsg.rate = 0.9;
                    replayMsg.pitch = 1.0;
                    replayMsg.volume = 1;

                    const voicesNow = window.speechSynthesis.getVoices();
                    const preferredNow = voicesNow.find(v => v.lang.startsWith('en'));
                    if (preferredNow) replayMsg.voice = preferredNow;

                    window.speechSynthesis.speak(replayMsg);

                    // Visual feedback
                    const indicator = document.getElementById('soundIndicator');
                    indicator.style.background = 'rgba(0, 210, 160, 0.35)';
                    indicator.style.borderColor = '#00d2a0';
                    document.getElementById('soundStatus').textContent = '🔊 Playing';
                    setTimeout(() => {
                        indicator.style.background = 'rgba(0, 210, 160, 0.15)';
                        indicator.style.borderColor = 'rgba(0, 210, 160, 0.3)';
                        document.getElementById('soundStatus').textContent = 'Welcome';
                    }, 3000);
                });

                // Update status when speech ends
                window.speechSynthesis.onend = function() {
                    document.getElementById('soundStatus').textContent = 'Welcome';
                };

            } else {
                // Fallback
                document.getElementById('soundStatus').textContent = '🔇 No Sound';
                document.querySelector('.sound-dots').style.display = 'none';
            }
        })();
    </script>

</body>
</html>
